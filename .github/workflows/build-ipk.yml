name: Build and Release IPK & APK Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - x86_64-23.05
          - x86_64-snapshots

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Package via OpenWrt SDK (${{ matrix.sdk }})
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk }}
          PACKAGES: luci-app-temp-status
          NO_EXTRA_IPKS: true

      - name: Collect Artifacts
        run: |
          mkdir -p output_packages
          find bin/packages/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} output_packages/ \;
          echo "=== Compiled Packages (${{ matrix.sdk }}) ==="
          ls -la output_packages/

      - name: Upload Single Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.sdk }}
          path: output_packages/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages

      - name: Consolidate Release Packages
        run: |
          mkdir -p release_files
          find all_packages/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} release_files/ \;
          echo "=== Final Release Package List ==="
          ls -la release_files/

      - name: Create Release and Upload IPK & APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
